<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Scene Editor</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --sub:#8b93a3; --accent:#5b8cff; --accent2:#37e0a5;
    --danger:#ff5c5c; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  #app{display:flex; flex-direction:column; flex:1; min-height:0;}
  header{
    padding:10px 16px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:16px; background:var(--panel);
    flex-shrink:0;
  }
  header h1{font-size:15px; font-weight:600; margin:0; letter-spacing:.3px; white-space:nowrap;}
  header .sep{width:1px; height:22px; background:var(--border);}
  .dropzone{
    flex:1; border:1.5px dashed var(--border); border-radius:8px; padding:8px 14px;
    font-size:13px; color:var(--sub); display:flex; align-items:center; gap:10px;
    cursor:pointer; transition:border-color .15s, color .15s;
  }
  .dropzone.drag{border-color:var(--accent); color:var(--text);}
  .dropzone input[type=file]{display:none;}
  .dropzone button{
    background:var(--accent); border:none; color:#fff; padding:6px 12px; border-radius:6px;
    font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .dropzone .url-input{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:12.5px; flex:1; min-width:120px;
  }
  .status{font-size:12px; color:var(--sub); white-space:nowrap;}
  .status.busy{color:var(--accent2);}

  .main{flex:1; display:flex; overflow:hidden; min-height:0;}

  /* LEFT STACK */
  .stack-panel{
    width:280px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .stack-header{
    padding:10px 12px; border-bottom:1px solid var(--border); font-size:12px;
    color:var(--sub); text-transform:uppercase; letter-spacing:.6px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .stack-list{flex:1; overflow-y:auto; padding:8px;}
  .scene-card{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    margin-bottom:8px; padding:8px; cursor:grab; display:flex; gap:8px;
    align-items:center; transition:border-color .12s, transform .12s;
  }
  .scene-card.dragging{opacity:.35;}
  .scene-card.dragover{border-color:var(--accent);}
  .scene-card.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .scene-card.disabled{opacity:.4;}
  .scene-card.silence{border-color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, var(--panel2));}
  .scene-card.silence.disabled{opacity:.35;}
  .scene-card.silence .meta .idx{color:var(--danger);}
  .scene-card .thumb{
    width:56px; height:32px; border-radius:4px; background:#000 center/cover no-repeat;
    flex-shrink:0; border:1px solid var(--border);
  }
  .scene-card .meta{flex:1; min-width:0;}
  .scene-card .meta .idx{font-size:11px; color:var(--sub);}
  .scene-card .meta .dur{font-size:12.5px; font-weight:600;}
  .scene-card .actions{display:flex; gap:4px; flex-shrink:0;}
  .scene-card .actions button{
    background:transparent; border:1px solid var(--border); color:var(--sub);
    width:22px; height:22px; border-radius:5px; cursor:pointer; font-size:12px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .scene-card .actions button:hover{color:var(--text); border-color:var(--accent);}
  .scene-card .actions button.off{color:var(--danger); border-color:var(--danger);}

  .stack-footer{padding:10px 12px; border-top:1px solid var(--border); font-size:12px; color:var(--sub);}

  /* CENTER PREVIEW */
  .preview-panel{flex:1; display:flex; flex-direction:column; min-width:0; background:#000;}
  .preview-stage{flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0; background:#000;}
  .preview-stage video{max-width:100%; max-height:100%;}
  .empty-hint{color:var(--sub); font-size:13px; text-align:center; padding:40px;}
  .transport{
    background:var(--panel); border-top:1px solid var(--border); padding:10px 16px;
    display:flex; align-items:center; gap:12px; flex-shrink:0;
  }
  .transport button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .transport button.play{background:var(--accent); border-color:var(--accent);}
  .timeline-wrap{flex:1; display:flex; flex-direction:column; gap:3px;}
  .timeline{position:relative; height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; display:flex;}
  .timeline .seg{height:100%; box-shadow:inset -1px 0 0 var(--bg); box-sizing:border-box;}
  .timeline .seg:last-child{box-shadow:none;}
  .timeline .seg.disabled{opacity:.25;}
  .timeline .playhead{position:absolute; top:-3px; width:2px; height:14px; background:#fff; pointer-events:none;}
  .timeline-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--sub);}

  /* RIGHT TRIM PANEL */
  .trim-panel{
    width:320px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .trim-header{padding:10px 12px; border-bottom:1px solid var(--border); font-size:12px; color:var(--sub); text-transform:uppercase; letter-spacing:.6px;}
  .trim-body{padding:12px; display:flex; flex-direction:column; gap:14px;}
  .trim-empty{padding:20px 12px; color:var(--sub); font-size:13px;}
  .field label{font-size:11px; color:var(--sub); display:block; margin-bottom:4px;}
  .field .val{font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;}
  .clip-preview{width:100%; border-radius:6px; background:#000; max-height:140px;}
  .trim-track{
    position:relative; height:44px; background:var(--panel2); border-radius:6px; overflow:hidden;
    border:1px solid var(--border); cursor:pointer;
  }
  .trim-track .thumbs{position:absolute; inset:0; display:flex;}
  .trim-track .thumbs img{height:100%; flex:1; object-fit:cover; opacity:.55;}
  .trim-track .range{position:absolute; top:0; bottom:0; background:rgba(91,140,255,.28); border-left:2px solid var(--accent); border-right:2px solid var(--accent);}
  .trim-track .handle{
    position:absolute; top:0; bottom:0; width:10px; background:var(--accent); cursor:ew-resize;
    display:flex; align-items:center; justify-content:center; border-radius:3px;
  }
  .trim-track .handle::after{content:''; width:2px; height:16px; background:#fff; opacity:.8; border-radius:1px;}
  .trim-track .playhead2{
    position:absolute; top:-2px; bottom:-2px; width:2px; background:#fff;
    box-shadow:0 0 4px rgba(255,255,255,.9); pointer-events:none; z-index:2;
  }
  .field .val.scrub-time{color:var(--accent2);}
  .scrub-preview{background:#000; border-radius:6px; overflow:hidden; border:1px solid var(--border);}
  .scrub-preview canvas{width:100%; height:auto; display:block;}
  .trim-actions{display:flex; gap:8px;}
  .trim-actions button{
    flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:8px; border-radius:6px; font-size:12.5px; cursor:pointer;
  }
  .trim-actions button:hover{border-color:var(--accent);}
  .trim-actions button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}

  .fit-options{display:flex; gap:6px;}
  .fit-btn{
    flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--sub);
    padding:7px 4px; border-radius:6px; font-size:12px; cursor:pointer; text-transform:capitalize;
  }
  .fit-btn:hover{border-color:var(--accent); color:var(--text);}
  .fit-btn.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}

  .ratio-select{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:12.5px; cursor:pointer;
  }

  .export-btn{
    background:var(--accent2); border:none; color:#0a0f0c; padding:7px 14px; border-radius:6px;
    font-size:12.5px; cursor:pointer; font-weight:700; white-space:nowrap;
  }
  .export-btn:disabled{opacity:.5; cursor:not-allowed;}

  .speech-btn{
    background:transparent; border:1px solid var(--accent); color:var(--accent); padding:7px 14px;
    border-radius:6px; font-size:12.5px; cursor:pointer; font-weight:700; white-space:nowrap;
  }
  .speech-btn:hover:not(:disabled){background:var(--accent); color:#fff;}
  .speech-btn:disabled{opacity:.5; cursor:not-allowed;}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center; z-index:1000;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; width:420px; max-width:90vw;
  }
  .modal-title{font-size:14px; font-weight:600; margin-bottom:14px; word-break:break-all;}
  .modal-options{display:flex; flex-direction:column; gap:8px;}
  .modal-option{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; text-align:left; cursor:pointer; color:var(--text);
  }
  .modal-option:hover{border-color:var(--accent);}
  .modal-option-title{font-size:13px; font-weight:600;}
  .modal-option-desc{font-size:11.5px; color:var(--sub); margin-top:2px;}

  .progress-bar{
    position:fixed; top:0; left:0; height:2px; background:var(--accent2); z-index:999;
    transition:width .15s linear;
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/jsx-module" id="app-source">
import { applyDiff, createElement, Fragment } from "https://esm.sh/webjsx@0.0.73";
import createRNNWasmModuleSync from "https://cdn.jsdelivr.net/npm/@timephy/rnnoise-wasm@1.0.0/dist/generated/rnnoise-sync.js";
import RnnoiseProcessor, { RNNOISE_SAMPLE_LENGTH } from "https://cdn.jsdelivr.net/npm/@timephy/rnnoise-wasm@1.0.0/dist/RnnoiseProcessor.js";

/* ---------------- State ---------------- */

const CANVAS_RATIOS = [
  { id: "16:9", w: 16, h: 9, label: "16:9 Landscape" },
  { id: "9:16", w: 9, h: 16, label: "9:16 Portrait" },
  { id: "1:1", w: 1, h: 1, label: "1:1 Square" },
  { id: "4:3", w: 4, h: 3, label: "4:3 Classic" },
];

const state = {
  sources: [],          // {id, url, name, width, height} — one entry per loaded video file/URL
  status: "Drop a video file or paste a URL to begin",
  busy: false,
  progress: 0,
  scenes: [],          // {id, sourceId, start, end, enabled, thumb, fit}
  order: [],           // array of scene ids, defines stack order
  activeSceneId: null,
  playingIndex: -1,    // index into enabledOrder during sequential playback
  isPlaying: false,
  dragId: null,
  trimDragHandle: null, // 'in' | 'out' | null
  canvasRatio: "16:9",
  exporting: false,
  exportProgress: 0,
  speechScanning: false,
  speechScanProgress: 0,
  pendingImport: null, // {kind: 'file'|'url', file, url, name} — awaiting an import-mode choice
};

/* ---------------- Undo/redo: 50-step history over {scenes, order, activeSceneId} ---------------- */

const HISTORY_LIMIT = 50;
// history[historyIndex] is always the snapshot matching the CURRENT state.
// Undo moves historyIndex back and restores; redo moves it forward and restores.
// Sources/blob URLs are never part of a snapshot (undo only reorders/edits/removes
// scenes referencing them, it never needs to recreate a source), and scene objects
// are deep-cloned so a later in-place mutation (e.g. a trim drag) can't reach back
// and corrupt an already-pushed snapshot.
const history = [];
let historyIndex = -1;
let lastSnapshotJSON = null;
let restoringHistory = false; // true while applying an undo/redo, so it isn't re-captured as a new step

function snapshotUndoSlice() {
  return { scenes: state.scenes, order: state.order, activeSceneId: state.activeSceneId };
}

function captureHistoryIfChanged() {
  if (restoringHistory || state.trimDragHandle) return; // mid-drag frames coalesce into one step at drag end
  const snap = snapshotUndoSlice();
  const json = JSON.stringify(snap);
  if (json === lastSnapshotJSON) return;
  const cloned = JSON.parse(json);
  history.splice(historyIndex + 1); // discard any redo-forward branch
  history.push(cloned);
  if (history.length > HISTORY_LIMIT) history.shift();
  historyIndex = history.length - 1;
  lastSnapshotJSON = json;
}

function canUndo() { return historyIndex > 0; }
function canRedo() { return historyIndex >= 0 && historyIndex < history.length - 1; }

function applyHistorySnapshot(snap) {
  restoringHistory = true;
  state.scenes = JSON.parse(JSON.stringify(snap.scenes));
  state.order = snap.order.slice();
  state.activeSceneId = snap.activeSceneId;
  lastSnapshotJSON = JSON.stringify(snap);
  render();
  restoringHistory = false;
}

function undo() {
  if (!canUndo()) return;
  historyIndex--;
  applyHistorySnapshot(history[historyIndex]);
}

function redo() {
  if (!canRedo()) return;
  historyIndex++;
  applyHistorySnapshot(history[historyIndex]);
}

function canvasRatioValue() {
  const r = CANVAS_RATIOS.find(r => r.id === state.canvasRatio) || CANVAS_RATIOS[0];
  return r.w / r.h;
}

// A scene needs a fit control only when its source's aspect ratio doesn't already
// match the output canvas — an exact match has nothing to crop/letterbox/stretch.
function sceneNeedsFit(scene) {
  const src = sourceFor(scene);
  if (!src || !src.width || !src.height) return false;
  const sceneRatio = src.width / src.height;
  return Math.abs(sceneRatio - canvasRatioValue()) > 0.01;
}

let uid = 1;
const nextId = () => uid++;

function sourceFor(sceneOrId) {
  const scene = typeof sceneOrId === "object" ? sceneOrId : state.scenes.find(s => s.id === sceneOrId);
  return scene ? state.sources.find(src => src.id === scene.sourceId) : null;
}

/* ---------------- Offscreen helpers ---------------- */

const offVideo = document.createElement("video");
offVideo.muted = true;
offVideo.playsInline = true;
offVideo.preload = "auto";

const offCanvas = document.createElement("canvas");
const offCtx = offCanvas.getContext("2d", { willReadFrequently: true });

// Separate canvas for thumbnail capture during the detection sweep, so
// grabFrameData's per-sample diff-analysis size and grabThumbFrame's larger
// thumbnail size don't thrash the same canvas's dimensions (a canvas resize
// clears its content, so doing both back-to-back on offCanvas would resize
// it twice per sample for no reason).
const thumbCanvas = document.createElement("canvas");
const thumbCtx = thumbCanvas.getContext("2d");

function seekOff(t) {
  return new Promise((resolve) => {
    const onSeeked = () => {
      offVideo.removeEventListener("seeked", onSeeked);
      resolve();
    };
    offVideo.addEventListener("seeked", onSeeked);
    offVideo.currentTime = t;
  });
}

function grabFrameData(w, h) {
  offCanvas.width = w;
  offCanvas.height = h;
  offCtx.drawImage(offVideo, 0, 0, w, h);
  try {
    return colorHistogram(offCtx.getImageData(0, 0, w, h).data);
  } catch (e) {
    if (e.name === "SecurityError") throw new TaintedCanvasError();
    throw e;
  }
}

class TaintedCanvasError extends Error {}

const HIST_BINS = 16;

function colorHistogram(data) {
  // 3 channels x HIST_BINS bins, normalized to sum to 1 per channel. Histograms
  // describe the overall color distribution of a frame while ignoring WHERE
  // colors sit spatially — this makes the comparison robust to camera pans,
  // handheld shake, and motion within a shot, which a raw per-pixel diff is not.
  //
  // HIST_BINS is 16 = 256 >> 4, so bin index is a right-shift, not a divide --
  // a real per-pixel cost cut confirmed by profiling (colorHistogram was the
  // single largest self-time cost after the seek->RVFC rewrite eliminated the
  // seek overhead that used to dominate). An 8-bit channel value's top 4 bits
  // (0-255 >> 4 = 0-15) always land in range, so the old Math.min clamp never
  // actually fired and is dropped.
  const hist = new Float32Array(HIST_BINS * 3);
  let count = 0;
  for (let i = 0; i < data.length; i += 4) {
    hist[data[i] >> 4]++;
    hist[HIST_BINS + (data[i + 1] >> 4)]++;
    hist[HIST_BINS * 2 + (data[i + 2] >> 4)]++;
    count++;
  }
  for (let i = 0; i < hist.length; i++) hist[i] /= count;
  return hist;
}

function frameDiff(a, b) {
  // Sum of absolute differences between normalized histograms, scaled to be
  // roughly comparable in magnitude to the old raw-pixel-diff thresholds.
  let sum = 0;
  for (let i = 0; i < a.length; i++) sum += Math.abs(a[i] - b[i]);
  return sum * 100;
}

function thumbAt(t) {
  return new Promise(async (resolve) => {
    await seekOff(t);
    const w = 160, h = Math.round(160 * (offVideo.videoHeight / offVideo.videoWidth || 0.5625));
    offCanvas.width = w; offCanvas.height = h;
    offCtx.drawImage(offVideo, 0, 0, w, h);
    try {
      resolve(offCanvas.toDataURL("image/jpeg", 0.6));
    } catch (e) {
      resolve(null);
    }
  });
}

/* ---------------- Scene detection ---------------- */

const SAMPLE_FPS = 4; // samples per second for diffing
const THUMB_W = 160; // thumbnail-quality capture width, grabbed during the sweep
const THUMB_SAMPLE_GAP = 0.25; // seconds between thumbnail captures during the sweep -- coarser than SAMPLE_FPS since only one thumb per scene is ever used; scenes shorter than this fall back to a targeted seek (thumbAt) for their thumbnail. Kept below MIN_LEN so short scenes still get a reused sample instead of a per-scene seek.

// Sweeps offVideo through [0, duration) ONCE via a fast muted playback pass,
// sampling frames with requestVideoFrameCallback instead of the old
// seek-per-sample approach (one real seek+decode round-trip per sample,
// ~4/sec, which a Chrome performance trace against the deployed build
// confirmed as the dominant cost for long-video import: drawImage/onSeeked
// were the top CPU-profile hotspots). RVFC fires at native frame rate as the
// video plays through, avoiding the keyframe-seek decode cost seeking pays
// on every call. Playback runs at an elevated rate where the browser allows
// it (offVideo is already muted, so audio-mute-at-speed is a non-issue) to
// shorten the sweep further. Falls back to 1x if the browser rejects a
// higher playbackRate outright (some engines throw on very high multiples).
// Captures a thumbnail-quality frame (THUMB_W wide) alongside every kept
// diff sample so a second seek-per-scene thumbnail pass isn't needed
// afterward -- capture-thumbnails-during-detection-sweep.
async function sweepVideoFrames(duration, w, h, onSample) {
  const hasRVFC = typeof offVideo.requestVideoFrameCallback === "function";
  if (!hasRVFC) {
    // Older/non-Chromium engine without RVFC support -- fall back to the
    // original seek-per-sample loop, still correct just slower.
    const sampleInterval = 1 / SAMPLE_FPS;
    const totalSamples = Math.max(2, Math.floor(duration / sampleInterval));
    for (let i = 0; i < totalSamples; i++) {
      const t = Math.min(duration - 0.02, i * sampleInterval);
      await seekOff(t);
      let data, thumb;
      try {
        data = grabFrameData(w, h);
        thumb = grabThumbFrame();
      } catch (e) {
        if (e instanceof TaintedCanvasError) return { corsBlocked: true };
        throw e;
      }
      onSample(t, data, thumb, (i + 1) / totalSamples);
    }
    return { corsBlocked: false };
  }

  offVideo.currentTime = 0;
  offVideo.playbackRate = 8; // muted; browsers commonly cap effective decode throughput below this, which is fine -- it only sets an upper bound
  const minSampleGap = 1 / SAMPLE_FPS;
  // grabThumbFrame is far more expensive to skip needlessly than grabFrameData
  // would suggest at a glance -- a second profile (Firefox) taken after the
  // seek->RVFC rewrite showed grabFrameData and grabThumbFrame as the two
  // remaining hot paths inside onFrame, both running once per diff-sample.
  // Only ONE thumbnail per detected scene is ever actually used (nearest to
  // that scene's midpoint), so capturing one on every diff-sample (up to
  // SAMPLE_FPS/sec) is mostly wasted work -- capture at a much coarser
  // interval instead; scenes shorter than THUMB_SAMPLE_GAP fall back to a
  // targeted seek (thumbAt) rather than always having a nearby candidate.
  let lastSampledAt = -Infinity;
  let lastThumbAt = -Infinity;
  let corsBlocked = false;
  let sawTaintedError = false;

  await new Promise((resolve, reject) => {
    let settled = false;
    const finish = () => { if (!settled) { settled = true; offVideo.removeEventListener("ended", onEnded); resolve(); } };
    // "ended" is the authoritative completion signal -- RVFC is not guaranteed
    // to fire again once the video reaches its end (reproduced: the sweep hung
    // at 100% forever waiting on one more callback that never came, once a cut
    // near the tail meant the last onSample already reported frac~1 before the
    // video actually finished playing out).
    const onEnded = () => finish();
    offVideo.addEventListener("ended", onEnded);
    const onFrame = (now, metadata) => {
      if (settled) return;
      if (sawTaintedError || offVideo.ended || offVideo.currentTime >= duration - 0.02) {
        finish();
        return;
      }
      const t = metadata.mediaTime;
      if (t - lastSampledAt >= minSampleGap) {
        lastSampledAt = t;
        try {
          const data = grabFrameData(w, h);
          let thumb = null;
          if (t - lastThumbAt >= THUMB_SAMPLE_GAP) {
            lastThumbAt = t;
            thumb = grabThumbFrame();
          }
          onSample(t, data, thumb, Math.min(1, t / duration));
        } catch (e) {
          if (e instanceof TaintedCanvasError) {
            corsBlocked = true;
            sawTaintedError = true;
            finish();
            return;
          }
          settled = true;
          offVideo.removeEventListener("ended", onEnded);
          reject(e);
          return;
        }
      }
      offVideo.requestVideoFrameCallback(onFrame);
    };
    offVideo.requestVideoFrameCallback(onFrame);
    offVideo.play().catch((e) => {
      // Some engines reject an elevated playbackRate outright rather than
      // silently clamping it -- retry once at normal speed before giving up.
      if (offVideo.playbackRate !== 1) {
        offVideo.playbackRate = 1;
        offVideo.play().catch(reject);
      } else {
        reject(e);
      }
    });
  });

  offVideo.pause();
  return { corsBlocked };
}

function grabThumbFrame() {
  const w = THUMB_W, h = Math.round(THUMB_W * (offVideo.videoHeight / offVideo.videoWidth || 0.5625));
  if (thumbCanvas.width !== w || thumbCanvas.height !== h) { thumbCanvas.width = w; thumbCanvas.height = h; }
  thumbCtx.drawImage(offVideo, 0, 0, w, h);
  try {
    return thumbCanvas.toDataURL("image/jpeg", 0.6);
  } catch (e) {
    return null; // tainted canvas -- thumbnails just stay null, not fatal
  }
}

async function detectScenes(url, sourceId, sourceLabel) {
  state.busy = true;
  state.progress = 0;
  state.status = `Loading ${sourceLabel}...`;
  render();

  offVideo.src = url;
  await new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error("Timed out loading video (check the URL/CORS)")), 20000);
    offVideo.onloadedmetadata = () => { clearTimeout(timer); resolve(); };
    offVideo.onerror = () => { clearTimeout(timer); reject(new Error("Could not load video")); };
  });

  const duration = offVideo.duration;
  const source = state.sources.find(s => s.id === sourceId);
  if (source) {
    source.width = offVideo.videoWidth;
    source.height = offVideo.videoHeight;
  }

  const w = 96, h = Math.round(96 * (offVideo.videoHeight / offVideo.videoWidth || 0.5625));

  let prevData = null;
  const samples = []; // {t, diff}
  const thumbSamples = []; // {t, thumb} -- reused for capture-thumbnails-during-detection-sweep

  const { corsBlocked } = await sweepVideoFrames(duration, w, h, (t, data, thumb, frac) => {
    if (prevData) samples.push({ t, diff: frameDiff(prevData, data) });
    prevData = data;
    if (thumb) thumbSamples.push({ t, thumb });
    state.progress = Math.round(frac * 100);
    state.status = `Analyzing ${sourceLabel}... ${state.progress}%`;
    // Update the progress bar/status text directly instead of calling the
    // full render() from inside the tight RVFC sample loop. A Chrome trace
    // taken while this OOM'd showed jsEventListeners climbing steadily
    // (linear growth, ~40-60/tick) on a FIXED set of DOM nodes (node count
    // never changed) while re-rendering the whole App() tree here every
    // ~150ms during the sweep -- pointing at rapid/re-entrant render() calls
    // as the trigger regardless of the exact internal cause. These two nodes
    // are already mounted (detectScenes sets state.busy=true and calls
    // render() once before the sweep starts), so a direct, listener-free DOM
    // write is both cheaper and structurally can't leak listeners the way a
    // full re-render apparently did.
    updateSweepProgressDOM();
  });

  let cutTimes = [0];

  if (corsBlocked) {
    // Source doesn't allow cross-origin pixel access (no CORS headers) — fall back
    // to fixed-interval chunking so the editor still works, just without cut detection.
    const CHUNK_LEN = 5;
    for (let t = CHUNK_LEN; t < duration; t += CHUNK_LEN) cutTimes.push(t);
  } else if (samples.length) {
    // Adaptive thresholding: a real cut is a spike far above the LOCAL baseline
    // (recent motion/lighting level), not just a high absolute diff value. This
    // keeps continuous handheld/panning footage from being chopped into dozens
    // of false "scenes" while still catching genuine hard cuts.
    const WINDOW = 10; // samples of local history considered for the baseline
    const MIN_ABS = 60; // floor below which nothing is ever considered a cut (compression noise lives well under this)
    const SPIKE_MULT = 2.5; // must exceed baseline by this multiple
    const recent = [];
    for (const s of samples) {
      // Use the MAX of recent history (not the mean) as baseline: a mean is dragged
      // down by mostly-quiet frames, which lets a single noisy-but-non-cut frame
      // look like a huge multiple of it. Max tracks "how noisy has it gotten lately".
      const baseline = recent.length ? Math.max(...recent) : Infinity; // no history yet -> never auto-cut during warmup
      const isCut = s.diff >= MIN_ABS && s.diff > baseline * SPIKE_MULT;
      if (isCut) {
        cutTimes.push(s.t);
        recent.length = 0; // reset baseline after a cut so it isn't skewed by the jump
      } else {
        recent.push(s.diff);
        if (recent.length > WINDOW) recent.shift();
      }
    }
  }

  cutTimes.push(duration);
  // dedupe / enforce min scene length
  const MIN_LEN = 0.3;
  const cleaned = [cutTimes[0]];
  for (let i = 1; i < cutTimes.length; i++) {
    if (cutTimes[i] - cleaned[cleaned.length - 1] >= MIN_LEN) cleaned.push(cutTimes[i]);
  }
  if (cleaned[cleaned.length - 1] < duration - 0.01) cleaned.push(duration);

  const scenes = [];
  for (let i = 0; i < cleaned.length - 1; i++) {
    const start = cleaned[i];
    const end = cleaned[i + 1];
    scenes.push({
      id: nextId(),
      sourceId,
      start, end,
      trimIn: start,
      trimOut: end,
      enabled: true,
      thumb: null,
      fit: "cover",
    });
  }

  // Reuses the thumbnail-quality frames captured during the sweep instead of
  // seeking again per scene (capture-thumbnails-during-detection-sweep) --
  // picks whichever sampled frame lands closest to each scene's target
  // midpoint. Falls back to a single targeted seek (thumbAt) only for a
  // scene whose nearest sample isn't close enough to be representative
  // (corsBlocked skips the sweep entirely, or a scene shorter than one
  // sample interval could have no nearby sample), so long-video imports
  // with many scenes don't regress to one seek per scene.
  state.status = `Generating thumbnails for ${sourceLabel}...`;
  render();

  const THUMB_MATCH_TOLERANCE = THUMB_SAMPLE_GAP; // a sample this close to the target time is close enough to reuse
  for (let i = 0; i < scenes.length; i++) {
    const mid = scenes[i].start + Math.min(0.15, (scenes[i].end - scenes[i].start) / 3);
    let best = null, bestDist = Infinity;
    for (const s of thumbSamples) {
      const dist = Math.abs(s.t - mid);
      if (dist < bestDist) { best = s; bestDist = dist; }
    }
    scenes[i].thumb = best && bestDist <= THUMB_MATCH_TOLERANCE ? best.thumb : await thumbAt(mid);
    state.progress = Math.round(((i + 1) / scenes.length) * 100);
    // Direct DOM write instead of a full render() per scene -- same fix as
    // the sweep loop above, for the same reason: this loop can now run over
    // many more (much shorter) scenes, and a full re-render per iteration
    // reproduced the same freeze-at-100% the sweep loop was fixed for.
    updateSweepProgressDOM();
  }
  render();

  state.scenes = state.scenes.concat(scenes);
  state.order = state.order.concat(scenes.map(s => s.id));
  if (state.activeSceneId == null) state.activeSceneId = scenes[0] ? scenes[0].id : null;
  state.busy = false;
  state.status = corsBlocked
    ? `${sourceLabel}: ${scenes.length} chunks (source blocks pixel analysis — split into 5s segments instead)`
    : `${sourceLabel}: ${scenes.length} scenes detected (${state.scenes.length} total)`;
  render();
  return scenes;
}

// Loads a source as a single scene spanning its full duration, with no cut
// detection -- for imports the user explicitly wants to keep uncut.
async function loadAsIs(url, sourceId, sourceLabel) {
  state.busy = true;
  state.progress = 0;
  state.status = `Loading ${sourceLabel}...`;
  render();

  offVideo.src = url;
  await new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error("Timed out loading video (check the URL/CORS)")), 20000);
    offVideo.onloadedmetadata = () => { clearTimeout(timer); resolve(); };
    offVideo.onerror = () => { clearTimeout(timer); reject(new Error("Could not load video")); };
  });

  const duration = offVideo.duration;
  const source = state.sources.find(s => s.id === sourceId);
  if (source) {
    source.width = offVideo.videoWidth;
    source.height = offVideo.videoHeight;
  }

  const scene = {
    id: nextId(),
    sourceId,
    start: 0, end: duration,
    trimIn: 0, trimOut: duration,
    enabled: true,
    thumb: null,
    fit: "cover",
  };
  scene.thumb = await thumbAt(Math.min(0.15, duration / 3));

  state.scenes = state.scenes.concat([scene]);
  state.order = state.order.concat([scene.id]);
  if (state.activeSceneId == null) state.activeSceneId = scene.id;
  state.busy = false;
  state.status = `${sourceLabel}: loaded as-is (${state.scenes.length} total)`;
  render();
  return [scene];
}

/* ---------------- File / URL loading ---------------- */

function addSource(url, name) {
  const source = { id: nextId(), url, name };
  state.sources.push(source);
  return source;
}

// Stages a file/URL for import: creates the source, but defers BOTH scene
// creation and audio decode until the user picks an import mode via the
// pending-import modal. decodeSourceAudioMono44100 is only ever triggered
// on-demand from inside speechOnlyEdit when Speech Only actually runs
// (never speculatively here) -- for a large file, eagerly decoding the
// entire audio track (full-file ArrayBuffer + native-samplerate AudioBuffer
// + a re-rendered 44100Hz buffer + a copy of that) concurrently with
// detectScenes's own video-frame sweep was a real OOM cause, confirmed
// against a large real source file: several full-length buffers held in
// memory at once on top of the sweep's own per-frame work.
function loadFile(file) {
  if (state.pendingImport) return; // one import choice at a time; resolve the modal first
  if (!file || !file.type.startsWith("video/")) {
    state.status = "Please provide a valid video file";
    render();
    return;
  }
  const url = URL.createObjectURL(file);
  const source = addSource(url, file.name);
  state.pendingImport = { sourceId: source.id, url, name: file.name };
  render();
}

function loadURL(url) {
  if (state.pendingImport) return; // one import choice at a time; resolve the modal first
  if (!url) return;
  const name = url.split("/").pop().split("?")[0] || url;
  const source = addSource(url, name);
  state.pendingImport = { sourceId: source.id, url, name };
  render();
}

// Runs the chosen import mode for the staged pendingImport, then clears it.
async function resolvePendingImport(mode) {
  const pending = state.pendingImport;
  if (!pending) return;
  state.pendingImport = null;
  render();

  try {
    let newScenes;
    if (mode === "asis") {
      newScenes = await loadAsIs(pending.url, pending.sourceId, pending.name);
    } else {
      newScenes = await detectScenes(pending.url, pending.sourceId, pending.name);
      if (mode === "split-speech" && newScenes && newScenes.length) {
        await speechOnlyEdit(newScenes.map(s => s.id));
      }
    }
  } catch (err) {
    state.busy = false;
    state.status = "Error: " + err.message;
    render();
  }
}

/* ---------------- Ordering / editing ---------------- */

function orderedScenes() {
  return state.order
    .map(id => state.scenes.find(s => s.id === id))
    .filter(Boolean);
}

function enabledOrderedScenes() {
  return orderedScenes().filter(s => s.enabled);
}

function moveScene(dragId, dropId) {
  if (dragId === dropId) return;
  const order = state.order.slice();
  const from = order.indexOf(dragId);
  const to = order.indexOf(dropId);
  if (from < 0 || to < 0) return;
  order.splice(from, 1);
  order.splice(to, 0, dragId);
  state.order = order;
  render();
}

function toggleScene(id) {
  const s = state.scenes.find(s => s.id === id);
  if (s) s.enabled = !s.enabled;
  render();
}

function removeScene(id) {
  state.scenes = state.scenes.filter(s => s.id !== id);
  state.order = state.order.filter(x => x !== id);
  if (state.activeSceneId === id) {
    state.activeSceneId = state.order[0] || null;
  }
  render();
}

// Points <video id="mainVideo"> at the scene's source (swapping .src only when the
// source actually differs, since a <video> reload drops playback position) and
// resolves once it's safe to seek — immediately if no swap was needed, or after
// loadedmetadata if it was. Scenes from different source files are stitched into
// one linear sequence this way, one physical <video> element reused across them.
//
// The loaded source id is tracked as a DOM attribute on the element itself (not a
// JS variable) because webjsx's diffing can replace the underlying <video> node
// across renders (e.g. when the DOM tree structure changes elsewhere), silently
// resetting .src to empty — a JS-side "currently loaded" variable would then be
// stale and never notice the element lost its source.
function ensureVideoSource(mainVideo, scene) {
  const src = sourceFor(scene);
  if (!src) return Promise.resolve();
  if (mainVideo.dataset.loadedSourceId === String(src.id) && mainVideo.src) return Promise.resolve();
  return new Promise((resolve) => {
    mainVideo.src = src.url;
    mainVideo.dataset.loadedSourceId = String(src.id);
    mainVideo.onloadedmetadata = () => resolve();
  });
}

function selectScene(id) {
  state.activeSceneId = id;
  state.isPlaying = false;
  const s = state.scenes.find(s => s.id === id);
  const mainVideo = document.getElementById("mainVideo");
  if (s && mainVideo) {
    mainVideo.pause();
    ensureVideoSource(mainVideo, s).then(() => { mainVideo.currentTime = s.trimIn; });
  }
  render();
}

/* ---------------- Sequential playback ---------------- */

function playFromStart() {
  const list = enabledOrderedScenes();
  if (!list.length) return;
  state.isPlaying = true;
  state.playingIndex = 0;
  playCurrentSegment();
}

// Resumes playback from wherever the user last scrubbed/clicked/selected --
// the active scene at its current preview time -- instead of always jumping
// back to the sequence start. Falls back to the sequence start when the active
// scene isn't in the enabled sequence (e.g. it's disabled) or there's nothing
// parked yet.
function playFromCurrentPosition() {
  const list = enabledOrderedScenes();
  if (!list.length) return;
  const index = list.findIndex(s => s.id === state.activeSceneId);
  if (index === -1) {
    playFromStart();
    return;
  }
  const scene = list[index];
  const mainVideo = document.getElementById("mainVideo");
  const parkedTime = mainVideo && mainVideo.dataset.loadedSourceId === String(sourceFor(scene) && sourceFor(scene).id)
    ? mainVideo.currentTime
    : scene.trimIn;
  const startTime = Math.max(scene.trimIn, Math.min(scene.trimOut, parkedTime));
  state.isPlaying = true;
  state.playingIndex = index;
  playCurrentSegment(startTime);
}

// Shared boundary-crossing watcher used by BOTH live preview playback and
// export recording, so the two can never drift apart again the way they did
// when preview used the coarse ~250ms `timeupdate` event (which could overshoot
// trimOut by up to that long) while export used its own separate step loop that
// dropped the final frame instead of drawing it. Polls on requestAnimationFrame
// (paint-rate precision) and calls onFrame() before checking the boundary, so
// the very last valid frame always gets a chance to be observed/drawn.
function watchSceneBoundary(videoEl, scene, { onFrame, onBoundary }) {
  let cancelled = false;
  const step = () => {
    if (cancelled) return;
    // Draw/observe THIS frame first, even if currentTime has already reached or
    // passed trimOut — otherwise the last valid frame before the cut is silently
    // dropped instead of shown/recorded. Only stop advancing after that.
    if (onFrame) onFrame();
    if (videoEl.currentTime >= scene.trimOut || videoEl.ended) {
      onBoundary();
      return;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return () => { cancelled = true; };
}

let cancelBoundaryWatch = null;

async function playCurrentSegment(startTime = null) {
  const list = enabledOrderedScenes();
  const scene = list[state.playingIndex];
  const mainVideo = document.getElementById("mainVideo");
  if (!scene || !mainVideo) { stopPlayback(); return; }
  state.activeSceneId = scene.id;
  await ensureVideoSource(mainVideo, scene);
  if (!state.isPlaying) return; // stopped while the source was loading
  mainVideo.currentTime = startTime != null ? startTime : scene.trimIn;
  mainVideo.play().catch(() => {
    // e.g. AbortError from a backgrounded tab's power-saving pause — surface as
    // stopped rather than leaving playback silently stuck mid-sequence.
    if (state.isPlaying) stopPlayback();
  });
  render();

  if (cancelBoundaryWatch) cancelBoundaryWatch();
  cancelBoundaryWatch = watchSceneBoundary(mainVideo, scene, {
    onFrame: () => render(),
    onBoundary: () => {
      state.playingIndex++;
      if (state.playingIndex >= list.length) {
        stopPlayback();
      } else {
        playCurrentSegment();
      }
    },
  });
}

// Seeks playback to an absolute time within the enabled-scene sequence (as
// shown by the timeline bar) -- maps sequence time to (scene, in-scene time),
// then either jumps a live play-through to that scene/offset or just parks
// the preview there when stopped. The timeline previously rendered a playhead
// but had no click/drag handler at all, so scrubbing did nothing.
function seekToSequenceTime(seqTime) {
  const list = enabledOrderedScenes();
  if (!list.length) return;
  const totalDur = list.reduce((a, s) => a + (s.trimOut - s.trimIn), 0);
  let t = Math.max(0, Math.min(totalDur - 0.001, seqTime));
  let index = 0;
  for (; index < list.length; index++) {
    const segDur = list[index].trimOut - list[index].trimIn;
    if (t <= segDur || index === list.length - 1) break;
    t -= segDur;
  }
  const scene = list[index];
  const target = scene.trimIn + t;
  state.activeSceneId = scene.id;
  const mainVideo = document.getElementById("mainVideo");
  if (state.isPlaying) {
    state.playingIndex = index;
    ensureVideoSource(mainVideo, scene).then(() => {
      if (!state.isPlaying) return;
      mainVideo.currentTime = target;
    });
    if (cancelBoundaryWatch) cancelBoundaryWatch();
    cancelBoundaryWatch = watchSceneBoundary(mainVideo, scene, {
      onFrame: () => render(),
      onBoundary: () => {
        state.playingIndex++;
        if (state.playingIndex >= list.length) stopPlayback();
        else playCurrentSegment();
      },
    });
  } else if (mainVideo) {
    mainVideo.pause();
    ensureVideoSource(mainVideo, scene).then(() => { mainVideo.currentTime = target; });
  }
  render();
}

let timelineDragging = false;
function beginTimelineScrub(e) {
  const track = e.currentTarget;
  timelineDragging = true;
  const onMove = (ev) => {
    if (!timelineDragging) return;
    const rect = track.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    const list = enabledOrderedScenes();
    const totalDur = list.reduce((a, s) => a + (s.trimOut - s.trimIn), 0);
    seekToSequenceTime(pct * totalDur);
  };
  const onUp = () => {
    timelineDragging = false;
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  onMove(e);
}

function stopPlayback() {
  state.isPlaying = false;
  state.playingIndex = -1;
  if (cancelBoundaryWatch) { cancelBoundaryWatch(); cancelBoundaryWatch = null; }
  const mainVideo = document.getElementById("mainVideo");
  if (mainVideo) mainVideo.pause();
  render();
}

function togglePlay() {
  if (state.isPlaying) {
    stopPlayback();
  } else {
    playFromCurrentPosition();
  }
}

/* ---------------- Speech split: re-cut scenes into speech/silence segments, keeping both ---------------- */

// Gate: RNNoise VAD score below this counts as non-speech. Empirically tuned
// against 5 real recordings spanning 6s-573s and mean levels -26.4dB to -12.5dB
// (Node.js offline harness replaying the exact compress->normalize->RNNoise
// pipeline): kept-speech fraction is nearly flat between 0.4-0.5 on every
// clip, then drops meaningfully by 0.8-0.9 on at least one clip (86.6% vs
// 99.9% kept on a 42s clip) -- i.e. higher thresholds start cutting real
// dialog before lower ones show any corresponding benefit. Erring low
// favors keeping a little extra ambient audio around speech over ever
// cutting real dialog.
const VAD_THRESHOLD = 0.5;
const VAD_SMOOTH_FRAMES = 3; // rolling-average window (frames) to reduce per-frame VAD flicker
const SPEECH_PAD = 0.7; // seconds of lead-in/lead-out padding added around each kept region
// Silence shorter than this is kept rather than cut. Must comfortably exceed
// 2*SPEECH_PAD — padding is capped at half the real gap to the next region, so a
// too-small MIN_GAP would silently cap padding below SPEECH_PAD in the common case.
const SPEECH_MIN_GAP = 2 * SPEECH_PAD + 0.2;
// Reject any input scene or detected speech region shorter than this outright
// -- too short to be a meaningfully usable clip or to run detection on.
const MIN_CLIP_LENGTH = 1.0;

// Decode a source URL's full audio track once (mono, resampled to RNNoise's
// required 44100Hz) and cache it — multiple scenes on the same source clip
// reuse this instead of re-decoding/re-running RNNoise per scene.
const decodedAudioCache = new Map(); // sourceId -> Promise<Float32Array | null>

// Peak-normalizes samples in place to target dBFS (0 = full scale) and
// returns the applied linear gain. A silent/near-silent buffer is left
// untouched (gain 1) rather than amplified toward infinity. Analysis-only:
// never applied to the exported/rendered audio.
function peakNormalize(samples, targetDb = 0) {
  let peak = 0;
  for (let i = 0; i < samples.length; i++) {
    const abs = Math.abs(samples[i]);
    if (abs > peak) peak = abs;
  }
  if (peak <= 0) return 1;
  const targetPeak = Math.pow(10, targetDb / 20);
  const gain = targetPeak / peak;
  if (gain === 1) return 1;
  for (let i = 0; i < samples.length; i++) samples[i] *= gain;
  return gain;
}

// Decodes a source's audio for SPEECH DETECTION ONLY, at 44100Hz mono, run
// through a slow-attack/slow-release compressor so quiet-but-real dialog
// within a dynamically-varying recording gets brought up toward the same
// effective level as louder sections instead of sitting under the gate.
// The compressor + normalization below exist purely to make speech easier
// to detect; the exported/downloaded audio always uses the untouched
// original source (see exportVideo's gainNode.gain.value = 1) and never
// sees this processing.
async function decodeSourceAudioMono44100(source) {
  if (decodedAudioCache.has(source.id)) return decodedAudioCache.get(source.id);

  const promise = (async () => {
    const resp = await fetch(source.url);
    const arrayBuffer = await resp.arrayBuffer();
    const tmpCtx = new (window.AudioContext || window.webkitAudioContext)();
    let audioBuffer;
    try {
      audioBuffer = await tmpCtx.decodeAudioData(arrayBuffer);
    } catch (e) {
      return null; // no audio track / undecodable
    } finally {
      tmpCtx.close();
    }
    if (!audioBuffer.numberOfChannels) return null;

    const REQUIRED_HZ = 44100; // fixed by RNNoise's model, not configurable
    const offlineCtx = new OfflineAudioContext(
      1,
      Math.ceil(audioBuffer.duration * REQUIRED_HZ),
      REQUIRED_HZ
    );
    const bufferSrc = offlineCtx.createBufferSource();
    bufferSrc.buffer = audioBuffer;

    // Slow release keeps the compressor from pumping on every syllable (which
    // would distort the signal RNNoise/VAD sees); the goal here is to level
    // out whole quiet-vs-loud SECTIONS of a clip, not aggressively squash
    // moment-to-moment dynamics. Ratio 4:1 with a low threshold brings quiet
    // dialog up without fully flattening louder speech into the noise floor.
    const compressor = offlineCtx.createDynamicsCompressor();
    compressor.threshold.value = -40;
    compressor.knee.value = 30;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.05;
    compressor.release.value = 1.0;

    bufferSrc.connect(compressor);
    compressor.connect(offlineCtx.destination);
    bufferSrc.start();
    const rendered = await offlineCtx.startRendering();
    const mono = rendered.getChannelData(0).slice(); // mono Float32Array @ 44100Hz, compressed

    // Peak-normalize the compressed buffer so the VAD/level gate measures a
    // consistent reference regardless of how hot/quiet the source was overall.
    peakNormalize(mono, 0);
    return mono;
  })();

  decodedAudioCache.set(source.id, promise);
  return promise;
}

// Runs RNNoise across [rangeStart, rangeEnd) seconds of a decoded 44100Hz mono
// buffer and returns the list of speech regions (in seconds, absolute source
// time) that stay above the VAD gate after merging gaps shorter than
// SPEECH_MIN_GAP.
//
// Gates on RNNoise's own voice-activity-detection score (processAudioFrame's
// return value, a 0-1 speech probability the model was directly trained to
// output) rather than a fixed dBFS threshold on the denoised signal. A level
// threshold is fundamentally level-dependent -- a peak-normalized-but-quiet
// recording can still have real dialog sitting under a fixed dB gate even
// after normalization, since normalization only calibrates the single
// loudest sample, not the RMS level of quieter speech elsewhere in the clip.
// VAD score has no such dependency: it reflects how speech-like the frame's
// spectral shape is, independent of its absolute level. VAD_SMOOTH_FRAMES
// averages a short rolling window of scores (RNNoise's per-frame VAD can
// flicker frame-to-frame even within continuous speech) to avoid choppy
// region boundaries from single noisy frames.
//
// Takes an already-created `processor` rather than making its own: the
// underlying WASM build's RnnoiseProcessor.destroy() reliably crashes with a
// "memory access out of bounds" RuntimeError once its processor has handled a
// few hundred frames (reproduced directly against the library — processing
// itself stays correct indefinitely, only its free/destroy path is unsafe
// after sustained use). Since this runs once per scene, creating-and-destroying
// per scene would hit that crash on any multi-scene edit. The fix: the caller
// creates ONE processor for the whole speechOnlyEdit() run and never destroys
// it — WASM memory for a single page-lifetime instance is not a real leak risk.
async function findSpeechRegions(samples, rangeStart, rangeEnd, processor) {
  const REQUIRED_HZ = 44100;
  const frameLen = RNNOISE_SAMPLE_LENGTH; // 480

  const startSample = Math.floor(rangeStart * REQUIRED_HZ);
  const endSample = Math.min(samples.length, Math.ceil(rangeEnd * REQUIRED_HZ));

  let isSpeech = false;
  let regionStart = null;
  const regions = [];
  const recentVad = [];

  for (let i = startSample; i < endSample; i += frameLen) {
    const frame = new Float32Array(frameLen);
    const chunkLen = Math.min(frameLen, endSample - i);
    frame.set(samples.subarray(i, i + chunkLen));

    const vad = processor.processAudioFrame(frame, true); // denoise in place, returns 0-1 VAD score
    recentVad.push(vad);
    if (recentVad.length > VAD_SMOOTH_FRAMES) recentVad.shift();
    const smoothedVad = recentVad.reduce((a, b) => a + b, 0) / recentVad.length;
    const frameIsSpeech = smoothedVad >= VAD_THRESHOLD;
    const frameStartT = i / REQUIRED_HZ;
    const frameEndT = (i + chunkLen) / REQUIRED_HZ;

    if (frameIsSpeech && !isSpeech) {
      regionStart = frameStartT;
      isSpeech = true;
    } else if (!frameIsSpeech && isSpeech) {
      regions.push([regionStart, frameEndT]);
      isSpeech = false;
    }
  }
  if (isSpeech && regionStart != null) regions.push([regionStart, endSample / REQUIRED_HZ]);

  // Merge regions separated by a gap shorter than SPEECH_MIN_GAP so natural
  // pauses between words/breaths don't get chopped into a choppy staccato edit.
  const merged = [];
  for (const [s, e] of regions) {
    const last = merged[merged.length - 1];
    if (last && s - last[1] < SPEECH_MIN_GAP) {
      last[1] = e;
    } else {
      merged.push([s, e]);
    }
  }

  // Pad each region with a little lead-in/lead-out: the VAD gate fires right at
  // the threshold crossing, which tends to clip the soft onset/tail of a word.
  // Padding is capped at most of the ACTUAL silence gap to the neighboring region
  // (or the scene edge), not just half — two regions that are already contiguous,
  // or separated by only a sliver of silence, have nothing to pad into and must
  // stay as-is rather than having padding manufacture a cut that was never there,
  // but when a real gap exists each side can claim the bulk of it.
  const GAP_CAP_FRACTION = 0.9;
  const rangeStartS = startSample / REQUIRED_HZ;
  const rangeEndS = endSample / REQUIRED_HZ;
  const final = merged.map(([s, e], i) => {
    const prevEnd = i > 0 ? merged[i - 1][1] : rangeStartS;
    const nextStart = i < merged.length - 1 ? merged[i + 1][0] : rangeEndS;
    const leadPad = Math.min(SPEECH_PAD, (s - prevEnd) * GAP_CAP_FRACTION);
    const tailPad = Math.min(SPEECH_PAD, (nextStart - e) * GAP_CAP_FRACTION);
    return [s - Math.max(0, leadPad), e + Math.max(0, tailPad)];
  });
  return final;
}

// Turns a scene's detected speech regions into an ordered list of
// [start, end, isSilence] sub-ranges covering the WHOLE scene span, so the
// caller never has to drop time -- gaps between/around speech regions become
// their own silence sub-ranges instead of being discarded.
function speechAndSilenceRanges(regions, rangeStart, rangeEnd) {
  const ranges = [];
  let cursor = rangeStart;
  for (const [s, e] of regions) {
    if (s - cursor >= MIN_CLIP_LENGTH) ranges.push([cursor, s, true]);
    ranges.push([Math.max(cursor, s), e, false]);
    cursor = e;
  }
  if (rangeEnd - cursor >= MIN_CLIP_LENGTH) ranges.push([cursor, rangeEnd, true]);
  return ranges;
}

async function speechOnlyEdit(sceneIds = null) {
  const scenesToProcess = sceneIds
    ? orderedScenes().filter(s => sceneIds.includes(s.id) && s.enabled)
    : orderedScenes().filter(s => s.enabled);
  if (!scenesToProcess.length || state.speechScanning) return;

  state.speechScanning = true;
  state.speechScanProgress = 0;
  state.status = "Loading speech detector...";
  render();

  let processor;
  try {
    const wasmModule = await createRNNWasmModuleSync();
    processor = new RnnoiseProcessor(wasmModule); // one shared instance for the whole run, see findSpeechRegions
  } catch (e) {
    state.speechScanning = false;
    state.status = "Error: could not load speech detector — " + e.message;
    render();
    return;
  }

  const newScenesBySlot = [];
  const rejectedTooShortIds = new Set();
  let silenceCount = 0;

  for (let idx = 0; idx < scenesToProcess.length; idx++) {
    const scene = scenesToProcess[idx];
    const src = sourceFor(scene);
    state.status = `Screening ${src ? src.name : "clip"} for speech... (${idx + 1}/${scenesToProcess.length})`;
    state.speechScanProgress = Math.round((idx / scenesToProcess.length) * 100);
    render();

    if (!src) continue;
    if (scene.trimOut - scene.trimIn < MIN_CLIP_LENGTH) {
      // Too short to meaningfully run speech detection on -- reject from this
      // Speech Only pass and leave the scene exactly as-is in the stack,
      // rather than feeding a sliver into RNNoise/VAD or silently deleting it.
      rejectedTooShortIds.add(scene.id);
      continue;
    }
    const samples = await decodeSourceAudioMono44100(src);
    if (!samples) {
      // No audio track at all on this clip -- the whole scene counts as silence,
      // kept in the stack and highlighted rather than dropped.
      newScenesBySlot.push({
        id: nextId(),
        sourceId: scene.sourceId,
        start: scene.start,
        end: scene.end,
        trimIn: scene.trimIn,
        trimOut: scene.trimOut,
        enabled: true,
        thumb: scene.thumb,
        fit: scene.fit,
        isSilence: true,
      });
      silenceCount++;
      continue;
    }

    const regions = await findSpeechRegions(samples, scene.trimIn, scene.trimOut, processor);
    const ranges = speechAndSilenceRanges(regions, scene.trimIn, scene.trimOut);

    for (const [start, end, isSilence] of ranges) {
      if (end - start < MIN_CLIP_LENGTH) continue; // sliver too short to be a usable clip
      newScenesBySlot.push({
        id: nextId(),
        sourceId: scene.sourceId,
        start: scene.start,
        end: scene.end,
        trimIn: start,
        trimOut: end,
        enabled: true,
        thumb: scene.thumb,
        fit: scene.fit,
        isSilence,
      });
      if (isSilence) silenceCount++;
    }
  }

  // Replace only the scenes that were actually processed, preserving the
  // position of any disabled scenes AND any too-short rejected scenes
  // (rejectedTooShortIds) left untouched in the stack.
  const processedIds = new Set(scenesToProcess.filter(s => !rejectedTooShortIds.has(s.id)).map(s => s.id));
  const rebuiltOrder = [];
  const rebuiltScenes = state.scenes.filter(s => !processedIds.has(s.id));
  let insertedReplacement = false;
  for (const id of state.order) {
    if (!processedIds.has(id)) {
      rebuiltOrder.push(id);
      continue;
    }
    if (!insertedReplacement) {
      for (const ns of newScenesBySlot) {
        rebuiltScenes.push(ns);
        rebuiltOrder.push(ns.id);
      }
      insertedReplacement = true;
    }
  }

  state.scenes = rebuiltScenes;
  state.order = rebuiltOrder;
  state.activeSceneId = rebuiltOrder[0] || null;
  state.speechScanning = false;
  state.speechScanProgress = 100;
  const rejectedSuffix = rejectedTooShortIds.size
    ? ` (${rejectedTooShortIds.size} scene(s) skipped: shorter than ${MIN_CLIP_LENGTH}s)`
    : "";
  const speechCount = newScenesBySlot.length - silenceCount;
  state.status = (newScenesBySlot.length
    ? `Split: ${scenesToProcess.length} scene(s) re-cut into ${speechCount} speech and ${silenceCount} silence segment(s)`
    : "Split: no speech or silence detected in any enabled scene") + rejectedSuffix;
  render();
}

/* ---------------- Export / render to downloadable video ---------------- */

function drawSceneFrame(ctx, video, scene, canvasW, canvasH) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvasW, canvasH);

  const fit = scene.fit || "cover";
  const canvasRatio = canvasW / canvasH;
  const videoRatio = vw / vh;

  if (fit === "fill") {
    ctx.drawImage(video, 0, 0, vw, vh, 0, 0, canvasW, canvasH);
    return;
  }

  // cover: scale so the frame fully fills the canvas, cropping overflow.
  // contain: scale so the whole frame fits inside the canvas, letterboxed.
  const scale = fit === "cover"
    ? Math.max(canvasW / vw, canvasH / vh)
    : Math.min(canvasW / vw, canvasH / vh);
  const drawW = vw * scale, drawH = vh * scale;
  const dx = (canvasW - drawW) / 2, dy = (canvasH - drawH) / 2;
  ctx.drawImage(video, 0, 0, vw, vh, dx, dy, drawW, drawH);
}

async function exportVideo() {
  const list = enabledOrderedScenes();
  if (!list.length || state.exporting) return;

  state.exporting = true;
  state.exportProgress = 0;
  render();

  const ratio = CANVAS_RATIOS.find(r => r.id === state.canvasRatio) || CANVAS_RATIOS[0];
  const canvasW = 1280;
  const canvasH = Math.round(canvasW * (ratio.h / ratio.w));

  const canvas = document.createElement("canvas");
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext("2d");

  const exportVideoEl = document.createElement("video");
  exportVideoEl.muted = false;
  exportVideoEl.playsInline = true;
  exportVideoEl.preload = "auto";

  const FPS = 30;
  const canvasStream = canvas.captureStream(FPS);

  // Route each scene's audio into the recorded stream via a shared AudioContext
  // destination, so the exported file keeps sound instead of coming out silent.
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioDest = audioCtx.createMediaStreamDestination();
  let sourceNode = null;
  let connectedEl = null;
  const gainNode = audioCtx.createGain();
  gainNode.connect(audioDest);

  const mixedStream = new MediaStream([
    ...canvasStream.getVideoTracks(),
    ...audioDest.stream.getAudioTracks(),
  ]);

  const mimeType = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
  ].find(t => MediaRecorder.isTypeSupported(t)) || "video/webm";

  const recorder = new MediaRecorder(mixedStream, { mimeType, videoBitsPerSecond: 6_000_000 });
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };

  const finished = new Promise((resolve) => { recorder.onstop = resolve; });
  recorder.start();

  try {
    let totalDur = 0;
    for (const s of list) totalDur += (s.trimOut - s.trimIn);
    let elapsed = 0;

    for (const scene of list) {
      const src = sourceFor(scene);
      if (!src) continue;

      if (exportVideoEl.src !== src.url) {
        exportVideoEl.src = src.url;
        await new Promise((resolve, reject) => {
          exportVideoEl.onloadedmetadata = resolve;
          exportVideoEl.onerror = () => reject(new Error("Could not load " + src.name));
        });
      }
      if (!connectedEl) {
        // createMediaElementSource may only be called once per <video> element ever,
        // so this connects on first use and is then reused across every scene/source
        // swap on this same element for the rest of the export.
        sourceNode = audioCtx.createMediaElementSource(exportVideoEl);
        sourceNode.connect(gainNode);
        connectedEl = exportVideoEl;
      }
      // Export always uses the source's untouched original level. Normalization/
      // compression/VAD gating exist only to decide which time ranges count as
      // speech for cutting -- they must never alter the rendered audio itself.
      gainNode.gain.value = 1;

      exportVideoEl.currentTime = scene.trimIn;
      await new Promise((resolve) => { exportVideoEl.onseeked = resolve; });
      await exportVideoEl.play();

      const sceneDur = scene.trimOut - scene.trimIn;
      const sceneStart = performance.now();

      // Same watchSceneBoundary helper live preview playback uses, so export's
      // cut points are identical to what was seen in preview — no separate
      // boundary logic left to drift out of sync.
      await new Promise((resolve) => {
        watchSceneBoundary(exportVideoEl, scene, {
          onFrame: () => {
            drawSceneFrame(ctx, exportVideoEl, scene, canvasW, canvasH);
            const sceneElapsed = (performance.now() - sceneStart) / 1000;
            state.exportProgress = Math.min(99, Math.round(((elapsed + sceneElapsed) / totalDur) * 100));
            render();
          },
          onBoundary: () => {
            exportVideoEl.pause();
            resolve();
          },
        });
      });

      elapsed += sceneDur;
    }
  } finally {
    recorder.stop();
    await finished;
    audioCtx.close();
  }

  const blob = new Blob(chunks, { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "linear-edit.webm";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);

  state.exporting = false;
  state.exportProgress = 100;
  state.status = "Export complete — download started";
  render();
}

/* ---------------- Trim handle dragging ---------------- */

// Draws mainVideo's current frame into the scrub-preview canvas, if present.
// Called on the video's 'seeked' event so it always reflects a real decoded
// frame rather than racing ahead of the decoder on every mousemove tick.
function drawScrubPreview() {
  const canvas = document.getElementById("scrubCanvas");
  const mainVideo = document.getElementById("mainVideo");
  if (!canvas || !mainVideo || !mainVideo.videoWidth) return;
  const ctx = canvas.getContext("2d");
  const vw = mainVideo.videoWidth, vh = mainVideo.videoHeight;
  const scale = Math.min(canvas.width / vw, canvas.height / vh);
  const drawW = vw * scale, drawH = vh * scale;
  const dx = (canvas.width - drawW) / 2, dy = (canvas.height - drawH) / 2;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(mainVideo, 0, 0, vw, vh, dx, dy, drawW, drawH);
}

// beginTrimDrag intentionally re-fetches mainVideo/trimTrack via
// document.getElementById() fresh inside every callback below, rather than
// capturing them once at drag-start, matching the safe pattern documented at
// syncActiveVideo: webjsx's diffing can replace DOM nodes across renders
// (e.g. if the tree structure changes elsewhere while a drag is in progress),
// which would silently detach a captured reference -- seeks writing to a
// detached video, the 'seeked' listener never firing again, or onMove's
// getBoundingClientRect() computed against a stale/removed track element.
function beginTrimDrag(handle, sceneId) {
  state.trimDragHandle = handle;
  const scene = state.scenes.find(s => s.id === sceneId);
  if (!scene) return;

  let pendingFrac = null;
  let rafScheduled = false;
  let seekedListenerVideo = null; // the element onSeeked is currently attached to

  // rAF-batches the seek so a burst of mousemove events (which can fire far
  // faster than the video can decode/seek) collapses to at most one seek per
  // frame instead of queuing up a backlog the video visibly lags behind.
  const flush = () => {
    rafScheduled = false;
    if (pendingFrac == null) return;
    const frac = pendingFrac;
    pendingFrac = null;
    const t = scene.start + frac * (scene.end - scene.start);
    if (handle === "in") {
      scene.trimIn = Math.min(t, scene.trimOut - 0.05);
      scene.trimIn = Math.max(scene.start, scene.trimIn);
    } else {
      scene.trimOut = Math.max(t, scene.trimIn + 0.05);
      scene.trimOut = Math.min(scene.end, scene.trimOut);
    }
    const mainVideo = document.getElementById("mainVideo");
    if (mainVideo) {
      mainVideo.currentTime = handle === "in" ? scene.trimIn : scene.trimOut;
      ensureSeekedListener(mainVideo);
    }
    render();
  };

  const onSeeked = () => drawScrubPreview();

  // Keeps the 'seeked' listener attached to whichever <video> element is
  // currently live, re-attaching if webjsx swapped it out from under the drag.
  function ensureSeekedListener(mainVideo) {
    if (seekedListenerVideo === mainVideo) return;
    if (seekedListenerVideo) seekedListenerVideo.removeEventListener("seeked", onSeeked);
    mainVideo.addEventListener("seeked", onSeeked);
    seekedListenerVideo = mainVideo;
  }

  const onMove = (e) => {
    if (e.touches) e.preventDefault(); // stop the page from scrolling under a touch drag
    const trackEl = document.getElementById("trimTrack");
    if (!trackEl) return;
    const rect = trackEl.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let frac = (clientX - rect.left) / rect.width;
    pendingFrac = Math.max(0, Math.min(1, frac));
    if (!rafScheduled) {
      rafScheduled = true;
      requestAnimationFrame(flush);
    }
  };

  const initialVideo = document.getElementById("mainVideo");
  if (initialVideo) ensureSeekedListener(initialVideo);

  const onUp = () => {
    state.trimDragHandle = null;
    if (seekedListenerVideo) seekedListenerVideo.removeEventListener("seeked", onSeeked);
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    window.removeEventListener("touchmove", onMove);
    window.removeEventListener("touchend", onUp);
    // Refresh the handle-adjacent thumbnail to the actual trimmed frame so the
    // trim-track's visual strip reflects the current selection, not the scene's
    // original detection-time frame. Reads directly off mainVideo (already seeked
    // to trimIn/trimOut by flush() above) rather than the shared offVideo/offCanvas
    // singleton, which detectScenes/loadAsyncIs may be using for a different source.
    const mainVideo = document.getElementById("mainVideo");
    if (mainVideo && mainVideo.videoWidth) {
      const w = 160, h = Math.round(160 * (mainVideo.videoHeight / mainVideo.videoWidth));
      offCanvas.width = w; offCanvas.height = h;
      offCtx.drawImage(mainVideo, 0, 0, w, h);
      try {
        const thumb = offCanvas.toDataURL("image/jpeg", 0.6);
        if (handle === "in") scene.trimThumbIn = thumb; else scene.trimThumbOut = thumb;
      } catch (e) { /* tainted canvas (CORS source) -- leave existing thumb */ }
      render();
    }
  };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  // touchmove must be non-passive for onMove's preventDefault() to actually
  // block the browser's default touch-scroll gesture (addEventListener
  // defaults touch listeners to passive:true, which silently no-ops preventDefault).
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp);
}

function resetTrim(sceneId) {
  const s = state.scenes.find(s => s.id === sceneId);
  if (s) { s.trimIn = s.start; s.trimOut = s.end; }
  render();
}

function setSceneFit(sceneId, fit) {
  const s = state.scenes.find(s => s.id === sceneId);
  if (s) s.fit = fit;
  render();
}

/* ---------------- Formatting ---------------- */

function fmt(t) {
  if (!isFinite(t)) return "0:00.0";
  const m = Math.floor(t / 60);
  const s = (t % 60).toFixed(1);
  return `${m}:${s.padStart(4, "0")}`;
}

/* ---------------- Render ---------------- */

function SceneCard(scene, index) {
  const isActive = scene.id === state.activeSceneId;
  const dur = scene.trimOut - scene.trimIn;
  const src = sourceFor(scene);
  return (
    <div
      class={`scene-card ${isActive ? "active" : ""} ${!scene.enabled ? "disabled" : ""} ${scene.isSilence ? "silence" : ""} ${state.dragId === scene.id ? "dragging" : ""}`}
      draggable="true"
      onclick={() => selectScene(scene.id)}
      ondragstart={(e) => { state.dragId = scene.id; e.dataTransfer.effectAllowed = "move"; render(); }}
      ondragend={() => { state.dragId = null; render(); }}
      ondragover={(e) => e.preventDefault()}
      ondrop={(e) => { e.preventDefault(); if (state.dragId != null) moveScene(state.dragId, scene.id); }}
    >
      <div class="thumb" style={scene.thumb ? `background-image:url(${scene.thumb})` : ""}></div>
      <div class="meta">
        <div class="idx">Scene {index + 1}{state.sources.length > 1 && src ? ` · ${src.name}` : ""}{scene.isSilence ? " · silence" : ""}</div>
        <div class="dur">{fmt(dur)}</div>
      </div>
      <div class="actions">
        <button title={scene.enabled ? "Disable" : "Enable"} class={!scene.enabled ? "off" : ""}
          onclick={(e) => { e.stopPropagation(); toggleScene(scene.id); }}>
          {scene.enabled ? "✓" : "✕"}
        </button>
        <button title="Remove" onclick={(e) => { e.stopPropagation(); removeScene(scene.id); }}>{"–"}</button>
      </div>
    </div>
  );
}

function Timeline() {
  const list = orderedScenes();
  const total = list.reduce((a, s) => a + (s.enabled ? (s.trimOut - s.trimIn) : 0), 0) || 1;
  let playedUpTo = 0;
  if (state.isPlaying) {
    const enabled = enabledOrderedScenes();
    for (let i = 0; i < state.playingIndex; i++) {
      playedUpTo += enabled[i].trimOut - enabled[i].trimIn;
    }
    const mainVideo = document.getElementById("mainVideo");
    const cur = enabled[state.playingIndex];
    if (mainVideo && cur) playedUpTo += Math.max(0, mainVideo.currentTime - cur.trimIn);
  }
  const playheadPct = Math.min(100, (playedUpTo / total) * 100);

  return (
    <div class="timeline-wrap">
      <div class="timeline" onmousedown={beginTimelineScrub}>
        {list.filter(s => s.enabled).map(s => {
          const w = ((s.trimOut - s.trimIn) / total) * 100;
          return <div class="seg" style={`width:${w}%; background:${colorFor(s.id)}`}></div>;
        })}
        <div class="playhead" style={`left:${playheadPct}%`}></div>
      </div>
      <div class="timeline-labels">
        <span>0:00</span>
        <span>{fmt(total)} total</span>
      </div>
    </div>
  );
}

const colorCache = {};
function colorFor(id) {
  if (!colorCache[id]) {
    const hue = (id * 47) % 360;
    colorCache[id] = `hsl(${hue}, 55%, 45%)`;
  }
  return colorCache[id];
}

function TrimPanel() {
  const scene = state.scenes.find(s => s.id === state.activeSceneId);
  if (!scene) {
    return <div class="trim-panel"><div class="trim-header">Trim</div><div class="trim-empty">Select a scene to edit its in/out points.</div></div>;
  }
  const range = scene.end - scene.start;
  const inPct = ((scene.trimIn - scene.start) / range) * 100;
  const outPct = ((scene.trimOut - scene.start) / range) * 100;

  const mainVideo = document.getElementById("mainVideo");
  const isScrubbing = !!state.trimDragHandle && mainVideo && sourceFor(scene) && mainVideo.dataset.loadedSourceId === String(sourceFor(scene).id);
  const scrubTime = isScrubbing ? mainVideo.currentTime : null;
  const scrubPct = isScrubbing ? Math.max(0, Math.min(100, ((scrubTime - scene.start) / range) * 100)) : null;

  return (
    <div class="trim-panel">
      <div class="trim-header">Trim Scene</div>
      <div class="trim-body">
        <div class="field">
          <label>In point</label>
          <div class="val">{fmt(scene.trimIn)}</div>
        </div>
        <div class="field">
          <label>Out point</label>
          <div class="val">{fmt(scene.trimOut)}</div>
        </div>
        {isScrubbing && (
          <div class="field">
            <label>Scrubbing</label>
            <div class="val scrub-time">{fmt(scrubTime)}</div>
          </div>
        )}
        <div class="field">
          <label>Trimmed duration</label>
          <div class="val">{fmt(scene.trimOut - scene.trimIn)}</div>
        </div>
        <div
          class="trim-track"
          id="trimTrack"
        >
          {scene.thumb && (
            <div class="thumbs">
              <img src={scene.trimThumbIn || scene.thumb} />
              <img src={scene.thumb} />
              <img src={scene.trimThumbOut || scene.thumb} />
            </div>
          )}
          <div class="range" style={`left:${inPct}%; width:${outPct - inPct}%`}></div>
          {isScrubbing && <div class="playhead2" style={`left:${scrubPct}%`}></div>}
          <div
            class="handle" style={`left:calc(${inPct}% - 5px)`}
            onmousedown={(e) => { e.stopPropagation(); beginTrimDrag("in", scene.id); }}
            ontouchstart={(e) => { e.stopPropagation(); beginTrimDrag("in", scene.id); }}
          ></div>
          <div
            class="handle" style={`left:calc(${outPct}% - 5px)`}
            onmousedown={(e) => { e.stopPropagation(); beginTrimDrag("out", scene.id); }}
            ontouchstart={(e) => { e.stopPropagation(); beginTrimDrag("out", scene.id); }}
          ></div>
        </div>
        {isScrubbing && (
          <div class="scrub-preview">
            <canvas id="scrubCanvas" width="280" height="158"></canvas>
          </div>
        )}
        <div class="trim-actions">
          <button onclick={() => resetTrim(scene.id)}>Reset trim</button>
          <button class="primary" onclick={() => {
            const mainVideo = document.getElementById("mainVideo");
            if (mainVideo) { mainVideo.pause(); mainVideo.currentTime = scene.trimIn; mainVideo.play(); }
          }}>Preview clip</button>
        </div>
        {sceneNeedsFit(scene) && (
          <div class="field">
            <label>Doesn't match {state.canvasRatio} output — fit mode</label>
            <div class="fit-options">
              {["cover", "contain", "fill"].map(mode => (
                <button
                  class={`fit-btn ${scene.fit === mode ? "active" : ""}`}
                  onclick={() => setSceneFit(scene.id, mode)}
                >{mode}</button>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const list = orderedScenes();
  const activeScene = state.scenes.find(s => s.id === state.activeSceneId);

  return (
    <div class="root" style="display:contents">
      {state.busy && <div class="progress-bar" style={`width:${state.progress}%`}></div>}
      <header>
        <h1>Linear Scene Editor</h1>
        <div class="sep"></div>
        <div
          class={`dropzone ${state.dragOverPage ? "drag" : ""}`}
          ondragover={(e) => { e.preventDefault(); }}
          ondrop={(e) => {
            e.preventDefault();
            if (state.pendingImport) return;
            const f = e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) loadFile(f);
          }}
        >
          <button disabled={!!state.pendingImport} onclick={() => document.getElementById("fileInput").click()}>{state.sources.length ? "Add clip" : "Choose file"}</button>
          <input id="fileInput" type="file" accept="video/*" disabled={!!state.pendingImport} onchange={(e) => {
            const f = e.target.files[0];
            if (f) loadFile(f);
            e.target.value = "";
          }} />
          <input class="url-input" placeholder="...or paste a video URL and press Enter" type="text" disabled={!!state.pendingImport}
            onkeydown={(e) => { if (e.key === "Enter") { loadURL(e.target.value.trim()); e.target.value = ""; } }} />
          <span>drag more clips in to append them to the stack</span>
        </div>
        <div class="sep"></div>
        <button title="Undo (Ctrl+Z)" disabled={!canUndo()} onclick={() => undo()}>{"Undo"}</button>
        <button title="Redo (Ctrl+Y)" disabled={!canRedo()} onclick={() => redo()}>{"Redo"}</button>
        <div class="sep"></div>
        <button class="speech-btn" title="Split all clips into speech and silence segments (RNNoise VAD) — silence stays in the stack, highlighted red"
          disabled={!list.filter(s => s.enabled).length || state.speechScanning || state.exporting}
          onclick={() => speechOnlyEdit()}>
          {state.speechScanning ? `Screening... ${state.speechScanProgress}%` : "Mark Speech"}
        </button>
        <div class="sep"></div>
        <select class="ratio-select" title="Output canvas ratio" disabled={state.exporting} onchange={(e) => { state.canvasRatio = e.target.value; render(); }}>
          {CANVAS_RATIOS.map(r => (
            <option value={r.id} selected={r.id === state.canvasRatio}>{r.label}</option>
          ))}
        </select>
        <button class="export-btn" disabled={!list.filter(s => s.enabled).length || state.exporting || state.speechScanning} onclick={exportVideo}>
          {state.exporting ? `Rendering... ${state.exportProgress}%` : "Download video"}
        </button>
        <div class="sep"></div>
        <div class={`status ${state.busy ? "busy" : ""}`}>{state.status}</div>
      </header>

      <div class="main">
        <div class="stack-panel">
          <div class="stack-header">
            <span>Scene Stack ({list.filter(s=>s.enabled).length}/{list.length})</span>
          </div>
          <div class="stack-list">
            {list.length === 0 && !state.busy && <div class="trim-empty">No scenes yet.</div>}
            {list.map((s, i) => SceneCard(s, i))}
          </div>
          <div class="stack-footer">Drag cards to reorder playback sequence.</div>
        </div>

        <div class="preview-panel">
          <div class="preview-stage">
            <video id="mainVideo"
              style={state.scenes.length ? "" : "display:none"}
            ></video>
            {!state.scenes.length && <div class="empty-hint">Load a video to begin scene detection.<br/>Scenes will appear in the stack on the left.</div>}
          </div>
          <div class="transport">
            <button class={state.isPlaying ? "" : "play"} onclick={togglePlay} title={state.isPlaying ? "Stop" : "Play sequence"}>
              {state.isPlaying ? "■" : "▶"}
            </button>
            {Timeline()}
          </div>
        </div>

        {TrimPanel()}
      </div>
      {state.pendingImport && ImportModeModal()}
    </div>
  );
}

function ImportModeModal() {
  const name = state.pendingImport.name;
  return (
    <div class="modal-backdrop">
      <div class="modal">
        <div class="modal-title">How should "{name}" be added?</div>
        <div class="modal-options">
          <button class="modal-option" onclick={() => resolvePendingImport("asis")}>
            <div class="modal-option-title">Load as-is</div>
            <div class="modal-option-desc">One scene spanning the whole clip, no cuts.</div>
          </button>
          <button class="modal-option" onclick={() => resolvePendingImport("split")}>
            <div class="modal-option-title">Split into scenes</div>
            <div class="modal-option-desc">Auto-detect cuts and break the clip into scenes.</div>
          </button>
          <button class="modal-option" onclick={() => resolvePendingImport("split-speech")}>
            <div class="modal-option-title">Split + Mark Speech</div>
            <div class="modal-option-desc">Auto-detect cuts, then split each scene into speech and silence segments — silence stays in the stack, highlighted red.</div>
          </button>
        </div>
      </div>
    </div>
  );
}

const root = document.getElementById("app");

function render() {
  captureHistoryIfChanged();
  const tree = App();
  applyDiff(root, tree);
  syncActiveVideo();
}

// Direct DOM write for the progress bar/status text during a detection
// sweep, bypassing the full VDOM render() -- see the call site in
// detectScenes for why. Both nodes are assumed already mounted (state.busy
// must be true and render() called at least once before the sweep starts);
// silently no-ops if either is missing rather than throwing mid-sweep.
function updateSweepProgressDOM() {
  const bar = document.querySelector(".progress-bar");
  if (bar) bar.style.width = state.progress + "%";
  const statusEl = document.querySelector(".status");
  if (statusEl) statusEl.textContent = state.status;
}

// Keeps <video id="mainVideo"> pointed at the active scene's source. Only self-heals
// when idle (not mid-drag, not mid-playback) since both of those paths already manage
// the source/seek themselves and would fight a concurrent sync here.
function syncActiveVideo() {
  if (state.isPlaying || state.trimDragHandle) return;
  const mainVideo = document.getElementById("mainVideo");
  const scene = state.scenes.find(s => s.id === state.activeSceneId);
  if (!mainVideo || !scene) return;
  const src = sourceFor(scene);
  if (!src || (mainVideo.dataset.loadedSourceId === String(src.id) && mainVideo.src)) return;
  ensureVideoSource(mainVideo, scene).then(() => { mainVideo.currentTime = scene.trimIn; });
}

// Ctrl+Z / Ctrl+Y (and Ctrl+Shift+Z as the common redo alt) for undo/redo.
// Skipped while focus is in a text input (the URL field) so typing "z" or "y"
// there isn't hijacked into a history jump.
window.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const key = e.key.toLowerCase();
  if (key === "z" && e.shiftKey) {
    e.preventDefault();
    redo();
  } else if (key === "z") {
    e.preventDefault();
    undo();
  } else if (key === "y") {
    e.preventDefault();
    redo();
  }
});

// page-level drag styling
window.addEventListener("dragover", (e) => { e.preventDefault(); state.dragOverPage = true; });
window.addEventListener("dragleave", () => { state.dragOverPage = false; });
window.addEventListener("drop", (e) => {
  e.preventDefault();
  state.dragOverPage = false;
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

render();
</script>

<script>
(function () {
  const src = document.getElementById("app-source").textContent;
  const out = Babel.transform(src, {
    presets: [],
    plugins: [[Babel.availablePlugins["transform-react-jsx"], { runtime: "classic", pragma: "createElement", pragmaFrag: "Fragment" }]],
    sourceType: "module",
  }).code;
  const blob = new Blob([out], { type: "text/javascript" });
  const url = URL.createObjectURL(blob);
  import(url);
})();
</script>
</body>
